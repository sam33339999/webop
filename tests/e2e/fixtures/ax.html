<!doctype html>
<html>
<head><meta charset="utf-8"><title>ax</title>

</head>
<body>
<h1>Heading One</h1>
<p>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
<button id="submit">Submit</button>
<a href="/other.html">Go elsewhere</a>
<label>Secret <input id="pw" type="password" value="hunter2"></label>
<input id="pwbtn" type="password" role="button" value="topsecret42">

<select id="sel" aria-label="Color"><option value="r">Red</option><option value="g" selected>Green</option></select>

<div id="tail"></div>
<script>
  document.getElementById("hide").addEventListener("click", () => { document.title = "hide:clicked"; });
  document.getElementById("cover").addEventListener("click", () => { document.title = "cover:clicked"; });
  document.getElementById("shield").addEventListener("click", () => { document.title = "shield:clicked"; });
  document.getElementById("submit").addEventListener("click", (e) => { document.title = "clicked:" + e.isTrusted; });
  document.getElementById("far").addEventListener("click", (e) => { document.title = "far:" + e.isTrusted; });
