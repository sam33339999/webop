<!doctype html>
<html>
<head><meta charset="utf-8"><title>blocking</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
  #btn { width: 200px; height: 80px; }
  #field { width: 200px; }
</style>
</head>
<body>
<button id="btn">Block</button>
<input id="field" autofocus>
<script>
  // Blocks the main thread synchronously (a busy loop, not alert(): Playwright auto-dismisses dialogs on tracked pages).
  document.getElementById("btn").addEventListener("click", () => {
    const ms = Number(new URLSearchParams(location.search).get("ms") ?? 6000);
    const t = Date.now();
    while (Date.now() - t < ms) {}
  });
</script>
</body>
</html>
