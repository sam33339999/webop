<!doctype html>
<html><head><meta charset="utf-8"><title>webop</title>
<style>
body{font:14px system-ui;margin:16px}
code{background:#eee;padding:1px 4px;border-radius:3px}
#shot{position:relative;margin:12px 0;display:none}
#shot img{width:100%;display:block;border:1px solid #ccc}
#marker{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border:3px solid red;border-radius:50%;box-sizing:border-box;pointer-events:none}
button{font:inherit;padding:6px 12px;margin-right:8px}
</style></head>
<body>
<p><strong id="client"></strong> 想要在 <code id="site"></code> 上執行 <code id="level"></code> 操作。</p>
<div id="shot"><img id="img" alt=""><div id="marker" hidden></div></div>
<p>
<button id="once">本次允許</button>
<button id="always">永久允許</button>
<button id="deny">拒絕</button>
</p>
<script src="prompt.js"></script></body></html>
